<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>Card motif "typing": a field holding eight dots and a caret</title>
  <g id="ground">
    <rect x="0" y="0" width="800" height="480" fill="#0a0c0f"/>
  </g>
  <g id="content">
    <g id="motif" transform="translate(0 0)">
      <rect x="6" y="254" width="788" height="220" rx="48" fill="#0f3460" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="96" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="164" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="232" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="300" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="368" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="436" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="504" cy="364" r="17" fill="#00d2ff"/>
      <circle cx="572" cy="364" r="17" fill="#00d2ff"/>
      <line x1="664" y1="316" x2="664" y2="412" stroke="#eceef1" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
  <g id="guides">
    <rect id="safe" x="0" y="0" width="800" height="480" fill="none" stroke="#ffd43b" stroke-width="2"/>
    <line id="shelf" x1="0" y1="480" x2="800" y2="480" stroke="#ffd43b" stroke-width="2"/>
  </g>
</svg>
