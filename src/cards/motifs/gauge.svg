<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>Card motif "gauge": an instrument's face with a dial, its needle and two terminals</title>
  <desc>A line drawing of a bench instrument's face: a dial with its ticks and needle, and two terminals under it, the motif of the meter repository.</desc>
  <g id="ground">
    <rect x="0" y="0" width="800" height="480" fill="#0a0c0f"/>
  </g>
  <g id="content">
    <g id="motif" transform="translate(0 0)">
      <rect x="106" y="38" width="588" height="436" rx="32" fill="#0f3460" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M204 318A196 196 0 0 1 596 318" fill="none" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="248" y1="318" x2="220" y2="318" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="259.7" y1="237" x2="244.1" y2="228" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="319" y1="177.7" x2="310" y2="162.1" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="400" y1="166" x2="400" y2="138" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="481" y1="177.7" x2="490" y2="162.1" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="540.3" y1="237" x2="555.9" y2="228" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="552" y1="318" x2="580" y2="318" stroke="#eceef1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="400" y1="318" x2="492.3" y2="199.8" stroke="#eceef1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="400" cy="318" r="22" fill="#00d2ff"/>
      <circle cx="268" cy="404" r="22" fill="#0a0c0f" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="532" cy="404" r="22" fill="#0a0c0f" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="guides">
