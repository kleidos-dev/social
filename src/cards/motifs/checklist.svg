<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>Card motif "checklist": a sheet with three rows, each a check and a bar</title>
  <desc>A line drawing of a sheet with three rows, each a check and a bar, the motif of the card of the agents repository.</desc>
  <g id="ground">
    <rect x="0" y="0" width="800" height="480" fill="#0a0c0f"/>
  </g>
  <g id="content">
    <g id="motif" transform="translate(0 0)">
      <rect x="294" y="46" width="500" height="428" rx="32" fill="#0f3460" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M358 142l26 26l46 -52" fill="none" stroke="#eceef1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="492" y1="142" x2="716" y2="142" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M358 258l26 26l46 -52" fill="none" stroke="#eceef1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="492" y1="258" x2="656" y2="258" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M358 374l26 26l46 -52" fill="none" stroke="#eceef1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="492" y1="374" x2="716" y2="374" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="guides">
    <rect id="safe" x="0" y="0" width="800" height="480" fill="none" stroke="#ffd43b" stroke-width="2"/>
    <line id="shelf" x1="0" y1="480" x2="800" y2="480" stroke="#ffd43b" stroke-width="2"/>
  </g>
</svg>
