<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>Card motif "swatches": five chips of the palette under the letters Aa</title>
  <desc>Five color chips of the Kleidos palette under the letters Aa, the motif of the card of the brand repository.</desc>
  <g id="ground">
    <rect x="0" y="0" width="800" height="480" fill="#0a0c0f"/>
  </g>
  <g id="content">
    <g id="motif" transform="translate(0 0)">
      <text id="aa" x="2" y="212" font-size="232" font-family="Mona Sans" font-weight="650" font-stretch="112.5%" style="font-variation-settings:'opsz' 72" letter-spacing="-0.02em" fill="#eceef1">Aa</text>
      <rect x="6" y="274" width="136" height="200" rx="24" fill="#0a0c0f" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="169" y="274" width="136" height="200" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="332" y="274" width="136" height="200" rx="24" fill="#00d2ff" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="495" y="274" width="136" height="200" rx="24" fill="#9aa3ad" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="658" y="274" width="136" height="200" rx="24" fill="#eceef1" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="guides">
    <rect id="safe" x="0" y="0" width="800" height="480" fill="none" stroke="#ffd43b" stroke-width="2"/>
    <line id="shelf" x1="0" y1="480" x2="800" y2="480" stroke="#ffd43b" stroke-width="2"/>
  </g>
</svg>
