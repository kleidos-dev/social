# What is more useful to everyone under the MIT License, as in brand: the
# tooling (the exporter, the checks, their tests, the CI, the pins and the
# configuration), and the commit-message gate, this repository's copy of the
# agents repository's git-commits skill (written by its sync_commit_check.py),
# under that repository's MIT License.
[[annotations]]
path = [
  "tools/**",
  "tests/**",
  ".github/**",
  "requirements.txt",
  ".pre-commit-config.yaml",
  ".editorconfig",
  ".gitignore",
  ".gitmodules",
  ".python-version",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 José M. Requena Plens <mail@kleidos.dev>"
SPDX-License-Identifier = "MIT"
